title: gpu-offload
tagline: Transparent CPU-to-GPU offloading for unmodified programs
description: >-
  gpu-offload runs the heavy math (BLAS and LAPACK calls) of unmodified programs such as NumPy, R
  and Octave scripts on an NVIDIA GPU when a per-machine calibration predicts that the GPU is
  faster, with automatic CPU fallback. No code changes, no recompilation.
